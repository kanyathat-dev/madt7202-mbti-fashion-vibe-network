name: Add final English report PDF

on:
  push:
    paths:
      - ".github/report-payload.trigger"

permissions:
  contents: write

jobs:
  add-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and validate PDF
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          import fitz

          payload_dir = Path(".github/report-payload")
          chunks = sorted(payload_dir.glob("part-*"))
          if len(chunks) != 10:
              raise RuntimeError(f"Expected 10 encoded chunks, found {len(chunks)}")
          encoded = "".join(p.read_text().strip() for p in chunks)
          pdf_bytes = base64.b64decode(encoded, validate=True)
          if not pdf_bytes.startswith(b"%PDF-"):
              raise RuntimeError("Decoded file is not a PDF")
          out = Path("report/MBTI_Fashion_Vibe_Network_Report_English.pdf")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(pdf_bytes)
          doc = fitz.open(out)
          if len(doc) != 1:
              raise RuntimeError(f"Expected one A4 report page, found {len(doc)}")
          uris = [link.get("uri", "") for link in doc[0].get_links()]
          required = [
              "https://www.myersbriggs.org/my-mbti-personality-type/the-16-mbti-personality-types/",
              "https://colab.research.google.com/drive/1a6PxetaHc75K0ae7KYHsezqhQ93kY9j9",
              "https://github.com/kanyathat-dev/madt7202-mbti-fashion-vibe-network",
          ]
          if not all(url in uris for url in required):
              raise RuntimeError(f"Expected links missing from PDF: {uris}")
          print(f"Validated {out}: {len(pdf_bytes):,} bytes, {len(doc)} page, {len(uris)} links")
          PY

      - name: Commit PDF and remove temporary upload files
        run: |
          rm -rf .github/report-payload
          rm -f .github/report-payload.trigger .github/workflows/add-report-pdf.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add final English report PDF"
          git push
