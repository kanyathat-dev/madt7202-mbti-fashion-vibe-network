name: Build temporary raw image contact sheets
on:
  push:
    paths:
      - ".github/contact-sheets.trigger"
permissions:
  contents: write
jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pillow
      - run: python .github/scripts/build_contact_sheets.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp_contact_sheets/
          git commit -m "Create temporary raw image contact sheets for mapping"
          git push
