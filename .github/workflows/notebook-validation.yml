name: Validate MADT7202 notebook

on:
  push:
    branches: [main]
    paths:
      - "MBTI_Fashion_Room_Network_Analytics.ipynb"
      - "data/raw_image_268_rows.csv"
      - "scripts/build_midterm_report.py"
      - ".github/workflows/notebook-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas networkx matplotlib requests ipywidgets jupyter nbconvert reportlab
      - name: Execute all notebook cells
        run: |
          mkdir -p /tmp/executed
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=300 \
            --output-dir=/tmp/executed \
            --output=MBTI_Fashion_Room_Network_Analytics.executed.ipynb \
            MBTI_Fashion_Room_Network_Analytics.ipynb
      - name: Assert regenerated baseline metrics
        run: |
          python - <<'PY'
          import nbformat
          from pathlib import Path

          path = Path("/tmp/executed/MBTI_Fashion_Room_Network_Analytics.executed.ipynb")
          nb = nbformat.read(path, as_version=4)
          errors = []
          streams = []
          for cell in nb.cells:
              if cell.cell_type != "code":
                  continue
              for output in cell.get("outputs", []):
                  if output.output_type == "error":
                      errors.append(f"{output.ename}: {output.evalue}")
                  if output.output_type == "stream":
                      streams.append(output.text)
          assert not errors, "\n".join(errors)
          text = "\n".join(streams)
          required = [
              "DATA INTEGRITY CHECKS: PASS",
              "Evidence rows: 268 | raw files: 67 | image IDs: 67",
              "Graph: 28 nodes | 51 retained positive-NPMI edges",
              "58/120 = 48.3%",
              "weighted betweenness = 0.3134",
              "bridge load = 33.0 fractional path-load units",
              "Playful-Streetwear stays top in 4/6 runs.",
              "MINIMUM CO-OCCURRENCE THRESHOLD SENSITIVITY",
          ]
          missing = [item for item in required if item not in text]
          assert not missing, f"Missing expected results: {missing}"
          print("Notebook execution and baseline metric assertions passed.")
          print("\n".join(item for item in required))
          PY
      - name: Build styled one-page midterm report
        run: |
          python scripts/build_midterm_report.py \
            --output "6810424002_Kanyathat Rakdee_MBTI_Fashion_Room_Network_Analytics_Midterm.pdf" \
            --graph mbti_network_topology_labeled.png \
            --root .
      - name: Commit executed notebook outputs
        run: |
          cp /tmp/executed/MBTI_Fashion_Room_Network_Analytics.executed.ipynb MBTI_Fashion_Room_Network_Analytics.ipynb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MBTI_Fashion_Room_Network_Analytics.ipynb
          git add "6810424002_Kanyathat Rakdee_MBTI_Fashion_Room_Network_Analytics_Midterm.pdf"
          if git diff --cached --quiet; then
            echo "Notebook outputs and PDF report are already current."
          else
            git commit -m "Store verified notebook outputs and refresh styled midterm report"
            git push origin HEAD:main
          fi
