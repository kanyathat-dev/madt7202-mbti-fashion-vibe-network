name: Build raw image audit preview

on:
  push:
    paths:
      - ".github/raw-image-audit.trigger"

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install image audit dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --quiet Pillow pandas pytesseract

      - name: Create contact sheet and OCR inventory
        run: |
          python - <<'PY'
          import ast, csv, json, re, hashlib
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          import pandas as pd
          import pytesseract

          root = Path(".")
          image_dir = root / "data/raw_lookbook_images"
          notebook = json.loads((root / "MBTI_Fashion_Room_Network_Analytics.ipynb").read_text(encoding="utf-8"))
          code = "".join(notebook["cells"][1].get("source", []))
          tree = ast.parse(code)
          raw_look_data = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "raw_look_data" for t in node.targets):
                  raw_look_data = ast.literal_eval(node.value)
                  break
          if raw_look_data is None:
              raise RuntimeError("raw_look_data was not found in Notebook")
          
          groups = {}
          for source_id, mbti, creator, vibe, attr, evidence, room in raw_look_data:
              image_id = re.sub(r"_L[1-4]$", "", source_id)
              groups.setdefault(image_id, []).append({
                  "raw_observation_id": source_id, "MBTI": mbti, "Creator": creator,
                  "Fashion Vibe": vibe, "Room Style": room, "Evidence": evidence,
                  "Fashion Attribute": attr
              })
          if len(raw_look_data) != 268 or len(groups) != 67:
              raise RuntimeError(f"Unexpected Notebook data: {len(raw_look_data)} coded rows, {len(groups)} image IDs")
          
          files = sorted(p for p in image_dir.iterdir() if p.is_file() and p.suffix.lower() in {".webp", ".jpg", ".jpeg", ".png"})
          if len(files) != 67:
              raise RuntimeError(f"Expected 67 files in raw image folder, got {len(files)}")
          
          rows = []
          thumbs = []
          for p in files:
              b = p.read_bytes()
              digest = hashlib.sha256(b).hexdigest()
              im = Image.open(p).convert("RGB")
              width, height = im.size
              im.thumbnail((180, 180))
              canvas = Image.new("RGB", (220, 270), "white")
              canvas.paste(im, ((220-im.width)//2, 0))
              draw = ImageDraw.Draw(canvas)
              try:
                  font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 10)
              except Exception:
                  font = ImageFont.load_default()
              name = p.name.replace("temp_image_", "")
              for j in range(0, len(name), 31):
                  draw.text((4, 184 + ((j//31)*13)), name[j:j+31], fill="black", font=font)
              # OCR at native and enlarged resolution; keep OCR output as evidence only, not a coded mapping.
              ocr_input = ImageOps.autocontrast(Image.open(p).convert("RGB"))
              ocr = pytesseract.image_to_string(ocr_input, config="--psm 11")
              rows.append({
                  "raw_name": p.name, "sha256": digest, "width": width, "height": height,
                  "size_bytes": len(b), "ocr_text": " ".join(ocr.split())[:1600],
                  "image_ids_for_MBti_candidate": ""
              })
              thumbs.append((p.name, canvas))
          
          out = Path("audit_preview")
          out.mkdir(exist_ok=True)
          pd.DataFrame(rows).to_csv(out/"raw_image_ocr_inventory.csv", index=False, encoding="utf-8-sig")
          
          # One 4-column sheet per page, with four images per row. Names/IDs remain readable at zoom.
          for page_no in range((len(thumbs)+23)//24):
              chunk = thumbs[page_no*24:(page_no+1)*24]
              sheet = Image.new("RGB", (4*220, 6*270), "white")
              for idx, (_, thumb) in enumerate(chunk):
                  sheet.paste(thumb, ((idx%4)*220, (idx//4)*270))
              sheet.save(out/f"raw_image_contact_sheet_{page_no+1}.jpg", quality=88)
          
          # Exact Notebook-derived coding details for 67 image IDs; no raw-file mapping is asserted here.
          coded_rows = []
          for image_id, obs in groups.items():
              coded_rows.append({
                  "Coded Image ID": image_id, "MBTI": obs[0]["MBTI"], "Creator": obs[0]["Creator"],
                  "Fashion Vibe": obs[0]["Fashion Vibe"], "Room Style": obs[0]["Room Style"],
                  "Evidence L1": obs[0]["Evidence"], "Evidence L2": obs[1]["Evidence"],
                  "Evidence L3": obs[2]["Evidence"], "Evidence L4": obs[3]["Evidence"]
              })
          pd.DataFrame(coded_rows).to_csv(out/"notebook_coded_image_reference.csv", index=False, encoding="utf-8-sig")
          print(f"Built OCR inventory for {len(files)} raw image files; Notebook has {len(groups)} coded image IDs.")
          PY

      - name: Upload audit preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-image-audit-preview
          path: audit_preview/
          retention-days: 3
