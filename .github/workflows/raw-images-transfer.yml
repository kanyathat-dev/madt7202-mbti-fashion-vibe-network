name: Package raw images for crosswalk audit

on:
  push:
    paths:
      - ".github/raw-images-transfer.trigger"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the 67 original images temporarily for the mapping audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          p = Path("data/raw_lookbook_images")
          images = sorted(x for x in p.iterdir() if x.is_file() and x.suffix.lower() in {".webp", ".jpg", ".jpeg", ".png"})
          if len(images) != 67:
              raise RuntimeError(f"Expected 67 raw images; found {len(images)}")
          out = Path("raw_images_for_crosswalk_audit.zip")
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=1) as z:
              for image in images:
                  z.write(image, arcname=image.name)
          print(f"Packaged {len(images)} raw images into {out} ({out.stat().st_size:,} bytes)")
          PY
      - name: Upload temporary audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-images-for-crosswalk-audit
          path: raw_images_for_crosswalk_audit.zip
          retention-days: 1
