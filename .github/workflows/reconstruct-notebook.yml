name: Reconstruct notebook

on:
  push:
    paths:
      - ".github/notebook-payload.trigger"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore notebook JSON
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload_dir = Path(".github/notebook-payload")
          parts = sorted(payload_dir.glob("part-*"))
          if len(parts) != 18:
              raise RuntimeError(f"Expected 18 payload chunks, found {len(parts)}")
          payload = b"".join(path.read_bytes() for path in parts)
          notebook_bytes = gzip.decompress(base64.b64decode(payload))
          notebook_path = Path("MBTI_Fashion_Room_Network_Analytics.ipynb")
          notebook_path.write_bytes(notebook_bytes)
          for path in parts:
              path.unlink()
          payload_dir.rmdir()
          Path(".github/notebook-payload.trigger").unlink()
          print(f"Restored {notebook_path} ({len(notebook_bytes):,} bytes)")
          PY

      - name: Commit restored notebook and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Colab analysis notebook"
          git push
