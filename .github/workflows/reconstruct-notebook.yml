name: Import Colab notebook

on:
  push:
    paths:
      - ".github/notebook-payload.trigger"

permissions:
  contents: write

jobs:
  import-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and validate the shared Colab notebook
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          url = "https://drive.google.com/uc?export=download&id=1a6PxetaHc75K0ae7KYHsezqhQ93kY9j9"
          request = Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urlopen(request, timeout=60) as response:
              raw = response.read()

          notebook = json.loads(raw.decode("utf-8"))
          if notebook.get("nbformat") != 4 or not isinstance(notebook.get("cells"), list):
              raise RuntimeError("The shared Drive URL did not return a valid Jupyter notebook.")
          if not notebook["cells"]:
              raise RuntimeError("The downloaded notebook has no cells.")

          title = "".join(notebook["cells"][0].get("source", []))
          if "MBTI" not in title or "Fashion Vibe" not in title:
              raise RuntimeError("The downloaded notebook title does not match this project.")

          target = Path("MBTI_Fashion_Room_Network_Analytics.ipynb")
          target.write_bytes(raw)
          print(f"Validated {target}: {len(notebook['cells'])} cells, {len(raw):,} bytes")
          PY

      - name: Commit notebook and remove temporary transfer files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .github/notebook-payload
          rm -f .github/notebook-payload.trigger .github/workflows/reconstruct-notebook.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Colab analysis notebook"
          git push
