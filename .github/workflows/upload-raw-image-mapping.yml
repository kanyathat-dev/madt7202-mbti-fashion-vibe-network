name: Upload raw image mapping CSV

on:
  push:
    paths:
      - ".github/raw-image-mapping-upload.trigger"

permissions:
  contents: write

jobs:
  add-mapping-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and validate the uploaded CSV
        run: |
          python - <<'PY'
          import base64, csv, gzip, hashlib, io
          from pathlib import Path

          encoded_path = Path(".github/raw-image-mapping.payload.b64")
          csv_bytes = gzip.decompress(base64.b64decode(encoded_path.read_text().strip()))
          expected_sha = "4740fbe67eb475e6c871fc5f646d988a5b1735a8234a03b61c523e5d0ebb50ed"
          actual_sha = hashlib.sha256(csv_bytes).hexdigest()
          if actual_sha != expected_sha:
              raise RuntimeError(f"CSV integrity hash mismatch: {actual_sha}")

          expected_columns = [
              "Raw Name", "Gemini Converted Filename", "Coded Image ID", "MBTI",
              "Creator", "Fashion Vibe", "Room Style", "Evidence"
          ]
          reader = csv.DictReader(io.StringIO(csv_bytes.decode("utf-8-sig")))
          if reader.fieldnames != expected_columns:
              raise RuntimeError(f"Unexpected columns: {reader.fieldnames}")
          rows = list(reader)
          if len(rows) != 268:
              raise RuntimeError(f"Expected 268 rows, found {len(rows)}")
          if len({r["Raw Name"] for r in rows}) != 67:
              raise RuntimeError("Expected 67 distinct Raw Name values")
          if len({r["Gemini Converted Filename"] for r in rows}) != 67:
              raise RuntimeError("Expected 67 distinct Gemini Converted Filename values")
          if len({r["Coded Image ID"] for r in rows}) != 268:
              raise RuntimeError("Expected 268 unique Coded Image IDs")
          if any(not (r.get("Evidence") or "").strip() for r in rows):
              raise RuntimeError("At least one Evidence value is blank")

          out = Path("data/raw_image_268_rows.csv")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(csv_bytes)
          print(f"Validated {out}: 268 rows, 8 columns, 67 raw names, SHA-256 {actual_sha}")
          PY

      - name: Commit only the CSV and remove temporary upload helper files
        run: |
          rm -f .github/raw-image-mapping.payload.b64
          rm -f .github/raw-image-mapping-upload.trigger
          rm -f .github/workflows/upload-raw-image-mapping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_image_268_rows.csv
          git add -u -- .github/raw-image-mapping.payload.b64 .github/raw-image-mapping-upload.trigger .github/workflows/upload-raw-image-mapping.yml
          git commit -m "Add 268-row raw image mapping CSV"
          git push
